# env staging · ต่างจาก env อื่นแค่: namespace · host · จำนวน replica · รหัส DB
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-staging
resources:
  - namespace.yaml
  - ../../base
  # P6: ความลับเข้ารหัสด้วย kubeseal → commit ได้ · ถอดได้เฉพาะตัวคุมใน cluster นี้ (ตัวเก่า: secretGenerator จาก db.env/tls.key ที่ไม่อยู่ใน git → Argo CD build ไม่ได้)
  - sealed-db.yaml
  - sealed-tls.yaml
replicas:
  - name: stockapi
    count: 1
patches:
  - target: { kind: Ingress, name: stockapi }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: stockapi.staging.localtest.me
      - op: replace
        path: /spec/tls/0/hosts/0
        value: stockapi.staging.localtest.me
      - op: replace          # ~1 = เครื่องหมาย / ในชื่อ annotation (กฎของ JSON patch)
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: shop-staging-redirect-https@kubernetescrd
