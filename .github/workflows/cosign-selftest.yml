# .github/workflows/cosign-selftest.yml — R3: เซ็น image + แนบ SBOM + ตรวจ + พิสูจน์ว่า image ที่ถูกสลับตรวจไม่ผ่าน
# ทดสอบจบในตัว: registry ชั่วคราวใน job · คู่กุญแจสร้างใหม่ทุก run (ไม่ต้องมี secret) · ไม่ส่งอะไรขึ้น Rekor สาธารณะ
name: cosign-selftest
on:
  push:
    branches: [realworld]
  workflow_dispatch:

permissions:
  contents: read            # ไม่ขอ id-token เพราะไม่ใช้ keyless

jobs:
  sign-verify:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    env:
      REPO: localhost:5000/stockapi-cs
      COSIGN_PASSWORD: selftest-only   # รหัสของกุญแจชั่วคราวที่ทิ้งหลังจบ job — ของจริงเก็บใน secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: สร้างคู่กุญแจชั่วคราว
        run: |
          cosign version
          cosign generate-key-pair      # ได้ cosign.key + cosign.pub ในโฟลเดอร์นี้
          # cosign v3: --tlog-upload=false ใช้ไม่ได้แล้ว (ลองแล้ว error) → ใช้ signing config ที่ไม่มี Rekor แทน
          cosign signing-config create --out no-rekor.json
          cat no-rekor.json

      - name: build + push (tag v1) แล้วจด digest
        run: |
          docker build -t "$REPO:v1" csharp
          docker push "$REPO:v1"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPO:v1")   # รูปแบบ localhost:5000/stockapi-cs@sha256:...
          echo "REF=$DIGEST" >> "$GITHUB_ENV"
          echo "image ที่จะเซ็น: $DIGEST"

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REPO }}:v1
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: sign ด้วย digest (ไม่ใช่ tag)
        # --signing-config ไม่มี Rekor = ไม่อัปโหลดอะไรขึ้น log สาธารณะ
        run: cosign sign --yes --key cosign.key --signing-config no-rekor.json "$REF"

      - name: แนบ SBOM เป็น attestation
        run: cosign attest --yes --key cosign.key --signing-config no-rekor.json --type spdxjson --predicate sbom.spdx.json "$REF"

      - name: verify ลายเซ็น + SBOM (ต้องผ่าน)
        # --insecure-ignore-tlog เพราะเราไม่ได้ลง Rekor — ใช้ได้เพราะเรา pin กุญแจ cosign.pub เอง
        run: |
          cosign verify --key cosign.pub --insecure-ignore-tlog "$REF"
          cosign verify-attestation --key cosign.pub --insecure-ignore-tlog --type spdxjson "$REF" > /dev/null
          echo "OK: image ที่เซ็นไว้ ตรวจผ่านทั้งลายเซ็นและ SBOM"

      - name: สลับ image ใต้ tag เดิม (จำลองคนร้าย)
        run: |
          printf 'FROM scratch\nLABEL tampered=true\n' | docker build -t "$REPO:v1" -
          docker push "$REPO:v1"
          EVIL=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPO:v1")
          echo "EVIL=$EVIL" >> "$GITHUB_ENV"
          echo "tag v1 เดิมตอนนี้ชี้ไป: $EVIL"
          [ "$EVIL" != "$REF" ] || { echo "FAIL: digest ไม่เปลี่ยน — test นี้ไม่มีความหมาย"; exit 1; }

      - name: ตรวจ image ที่ถูกสลับ (ต้องไม่ผ่าน)
        run: |
          # control: ตัวเดิมต้องยังผ่าน — กันกรณี verify พังเพราะ registry/สภาพแวดล้อม แล้วเราเข้าใจผิดว่า "จับของปลอมได้"
          cosign verify --key cosign.pub --insecure-ignore-tlog "$REF" > /dev/null
          echo "control OK: digest เดิมยังผ่าน"

          set +e
          cosign verify --key cosign.pub --insecure-ignore-tlog "$EVIL"
          by_digest=$?
          cosign verify --key cosign.pub --insecure-ignore-tlog "$REPO:v1"
          by_tag=$?
          set -e
          echo "verify ด้วย digest ของปลอม exit=$by_digest · verify ด้วย tag exit=$by_tag"
          if [ "$by_digest" -eq 0 ] || [ "$by_tag" -eq 0 ]; then
            echo "FAIL: image ที่ไม่เคยเซ็นตรวจผ่าน!"; exit 1
          fi
          echo "PASS: ของปลอมตรวจไม่ผ่านตามที่ต้องเป็น"

      - name: เซ็นด้วย tag หลังโดนสลับ (พิสูจน์ว่าทำไมต้องเซ็นด้วย digest)
        run: |
          set +e   # ให้ job เขียวต่อให้ขั้นไหนล้ม — เราต้องการเห็น exit code จริง
          echo "--- sign ด้วย tag $REPO:v1 (ตอนนี้ tag ชี้ไป $EVIL)"
          cosign sign --yes --key cosign.key --signing-config no-rekor.json "$REPO:v1"
          echo "sign-by-tag exit=$?"
          echo "--- verify digest เดิม (REF)"
          cosign verify --key cosign.pub --insecure-ignore-tlog "$REF" > /dev/null
          echo "verify REF exit=$?"
          echo "--- verify digest ใหม่ (EVIL)"
          cosign verify --key cosign.pub --insecure-ignore-tlog "$EVIL" > /dev/null
          echo "verify EVIL exit=$?"
