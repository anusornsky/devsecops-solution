# gitleaks: ใช้กฎมาตรฐานทั้งหมด + ยกเว้นข้อเดียว
[extend]
useDefault = true

# ciphertext ของ Sealed Secrets (ขึ้นต้น Ag… base64 ยาว) โดน generic-api-key จับผิด (พบจริง P6)
# ยกเว้นเมื่อ "ทั้งสองข้อ" จริง: ไฟล์ชื่อ sealed-*.yaml และบรรทัดหน้าตาเป็น ciphertext
# ทางที่ไม่เลือก: ยกเว้นทั้งไฟล์ — ใครเผลอวางรหัสจริงในไฟล์ชื่อนี้ gitleaks จะเงียบ
[[allowlists]]
description = "kubeseal ciphertext"
condition = "AND"
paths = ['''k8s/overlays/[^/]+/sealed-[^/]+\.yaml''']
regexTarget = "line"
regexes = ['''^\s+[A-Za-z0-9_.-]+: Ag[A-Za-z0-9+/=]{300,}$''']
